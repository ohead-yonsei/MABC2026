<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>비칸 — 공고 제출요건 누락 대조</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
  .doc-card{border-radius:10px;border:1px solid #e5e7eb;padding:12px 14px;background:#fff}
  .doc-card.ok{background:#f0fdf4;border-color:#86efac}
  .doc-card.missing{background:#fef2f2;border-color:#fca5a5}
  .doc-card.cond{border-color:#d1d5db}
  .doc-card .doc-name{font-weight:600;font-size:14px}
  .doc-card .doc-issued{font-size:12px;color:#4b5563;margin-top:2px}
  .doc-card .doc-tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;display:inline-block}
  .doc-card .doc-del{background:#fff;color:#991b1b;border:1px solid #dc2626;border-radius:5px;padding:2px 8px;font-size:12px}
  .doc-card .doc-edit{background:#fff;border:1px solid #6b7280;border-radius:5px;padding:2px 8px;font-size:12px;color:#111}
  .doc-card .doc-register{background:#fff;border:1px solid #16a34a;border-radius:5px;padding:2px 8px;font-size:12px;color:#15803d;font-weight:600}
  .doc-card .doc-issue{background:#fff;border:1px solid #2563eb;border-radius:5px;padding:2px 8px;font-size:12px;color:#1d4ed8;font-weight:600}
  #dropZone{border:2px dashed #d1d5db;border-radius:10px;padding:22px;transition:background .12s,border-color .12s;cursor:pointer}
  #dropZone.dragover{background:#eff6ff;border-color:#3b82f6}
  .tab-btn{font-size:13px;font-weight:500;padding:6px 10px;border-radius:6px;transition:background .12s,color .12s}
  .tab-btn.active{background:#eff6ff;color:#1d4ed8;font-weight:600}
  .tab-btn:not(.active):hover{background:#f3f4f6}
  .right-panel{}
  .tab-content{display:none}
  .tab-content.active{display:block}
  #right-docs{min-height:320px}
  #right-result{min-height:320px}
  .result-foot{margin-top:12px;padding-top:10px;border-top:1px solid #e5e7eb;color:#555;font-size:13px}
  /* 로딩 스피너 */
  .btn-spinner{width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle;animation:spin 0.7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .btn-loading{pointer-events:none;opacity:0.85}
  /* 레이아웃 안정화 */
  main.grid-layout{display:grid;grid-template-columns:1fr;gap:2rem;min-width:0}
  @media (min-width:1024px){
    main.grid-layout{grid-template-columns:1fr 1fr}
  }
  #left-panel,.right-panel{min-width:0;overflow-x:hidden}
  .right-panel.grid-col-span-2{lg:col-span-2}
  .doc-card .head,.doc-card .right{flex-wrap:wrap;min-width:0}
  .doc-name{word-break:break-word}
</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

<header class="bg-white border-b border-gray-200 sticky top-0 z-10">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-14 items-center">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-layer-group text-blue-600 text-lg"></i>
        <span class="font-bold text-base tracking-tight">비칸</span>
      </div>
      <nav class="hidden md:flex gap-2 text-sm font-medium text-gray-500">
        <a href="#" id="tab-intro" class="tab-btn cursor-default">서비스 소개</a>
        <a href="#" id="tab-compare" class="tab-btn active">공고 비교하기</a>
        <a href="#" id="tab-docs" class="tab-btn">내 서류함</a>
      </nav>
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-gray-500">
          <i class="fa-solid fa-user text-sm"></i>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full grid grid-cols-1 gap-8 lg:grid-cols-2">

  <!-- 왼쪽 패널: 공고 비교하기 탭에서만 노출 -->
  <div id="left-panel" class="lg:col-span-1">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
      <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
        <i class="fa-regular fa-file-lines text-gray-400"></i> 공고문 입력
      </h2>
      <textarea id="text" class="w-full flex-grow min-h-[300px] p-4 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition resize-none text-sm leading-relaxed" placeholder="분석할 공고문 내용을 여기에 붙여넣으세요."></textarea>
      <div id="dropZone" class="mt-5">
        <div class="w-12 h-12 bg-white rounded-full shadow-sm flex items-center justify-center mx-auto mb-3">
          <i class="fa-solid fa-cloud-arrow-up text-blue-500 text-xl"></i>
        </div>
        <p class="text-sm font-medium text-gray-700 text-center">여기로 공고문 파일을 드래그 앤 드롭 하세요</p>
        <p class="text-xs text-gray-400 mt-1 text-center">PDF, JPG, PNG 파일 지원 (최대 10MB)</p>
      </div>
      <p class="text-xs text-gray-400 mt-3 text-center">
        * 이 결과는 공고 원문 대조 결과이며 자격 판정이 아닙니다.
      </p>
      <div class="flex gap-3 mt-4">
        <button id="runBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition shadow-sm flex items-center justify-center">
          <span id="runBtnText">대조하기</span>
          <span id="runBtnSpinner" class="btn-spinner" style="display:none"></span>
        </button>
        <button id="sampleBtn" class="px-5 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-2.5 rounded-lg transition shadow-sm">
          예시 공고로 해보기
        </button>
      </div>
      <div id="runStatus" class="mt-3 text-xs text-gray-500 text-center min-h-[18px]"></div>
    </div>
  </div>

  <!-- 오른쪽 패널: 탭별로 내용이 바뀜 -->
  <div class="right-panel lg:col-span-1">
    <!-- 공고 비교하기 탭: 대조 결과 -->
    <div id="right-result" class="tab-content active">
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <div class="flex justify-between items-end mb-4">
          <h2 class="text-lg font-semibold flex items-center gap-2">
            <i class="fa-regular fa-folder-open text-gray-400"></i> 공고 비교 결과
          </h2>
          <div id="docCountTag" class="text-sm text-gray-500">내 서류: 0</div>
        </div>

        <div id="contrastList" class="flex flex-col gap-3 flex-grow overflow-y-auto pr-1"></div>

        <div id="contrastSummary" class="text-sm text-gray-500 mb-3">대조할 수 있는 서류가 없습니다. ‘내 서류함’에서 서류를 추가하세요.</div>
      </div>
    </div>

    <!-- 내 서류함 탭: 내 서류 관리 -->
    <div id="right-docs" class="tab-content">
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <div class="flex justify-between items-end mb-4">
          <h2 class="text-lg font-semibold flex items-center gap-2">
            <i class="fa-regular fa-folder-open text-gray-400"></i> 내 서류함
          </h2>
          <div id="docCountTagDocs" class="text-sm text-gray-500">총 서류: 0</div>
        </div>

        <div id="docListDocs" class="flex flex-col gap-3 flex-grow overflow-y-auto pr-1"></div>

        <div id="docPreview" class="mt-4 pt-4 border-t border-gray-100 hidden">
          <div class="flex justify-between items-start gap-3">
            <div>
              <p class="text-sm text-gray-400">선택한 서류</p>
              <p id="previewName" class="font-semibold text-lg mt-1"></p>
              <p id="previewIssued" class="text-sm text-gray-500 mt-1"></p>
              <p id="previewRegDate" class="text-sm text-gray-400 mt-1"></p>
              <p id="previewModDate" class="text-sm text-gray-400 mt-1"></p>
            </div>
            <div class="flex gap-2 shrink-0">
              <button id="previewEditBtn" class="text-sm text-gray-500 hover:text-gray-800">수정</button>
              <button id="previewDeleteBtn" class="text-sm text-red-600 hover:text-red-800">삭제</button>
            </div>
          </div>
          <button id="previewCloseBtn" class="mt-3 text-sm text-gray-500 hover:text-gray-800">닫기</button>
        </div>

        <div class="flex justify-between items-center mt-5 pt-4 border-t border-gray-100">
          <button id="docResetBtnDocs" class="text-sm text-gray-500 hover:text-gray-800 font-medium">전체 초기화</button>
          <button id="docAddBtnDocs" class="bg-gray-800 hover:bg-gray-900 text-white text-sm font-medium px-4 py-2 rounded-lg transition">
            새 서류 등록
          </button>
        </div>
      </div>
    </div>
  </div>

</main>

<footer class="bg-white border-t border-gray-200 mt-auto">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="flex justify-between items-center gap-4">
      <div class="text-sm text-gray-500">
        &copy; 2026 비칸. 이 결과는 공고 원문 대조 결과이며 자격 판정이 아닙니다.
      </div>
      <div class="flex gap-4 text-sm text-gray-500">
        <a href="#" class="hover:text-gray-800 cursor-default">이용약관</a>
        <a href="#" class="hover:text-gray-800 cursor-default">개인정보처리방침</a>
      </div>
    </div>
  </div>
</footer>

<script>
(function(){
  const SAMPLE_NOTICE = `2026년 청년 창업 도약 지원사업 모집 공고

1. 지원 대상: 공고일 기준 만 19세 이상 39세 이하, 사업자등록 3년 이내 창업자

2. 제출 서류
  가. 지원신청서(별지 제1호 서식) 1부
  나. 사업자등록증명원 사본 1부 (발급일로부터 3개월 이내의 것)
  다. 대표자 신분증 사본 1부
  라. 최근 연도 부가가치세 과세표준증명원 1부
  마. 4대보험 가입자명부 1부. 다만 대표자 1인 기업은 제출을 생략할 수 있다.
  바. 가점 대상자는 해당 증빙(장애인기업확인서, 여성기업확인서 등)을 함께 제출한다.
  사. 심사 과정에서 필요시 추가 서류를 요청할 수 있다.

3. 접수 기한: 2026년 9월 15일(화) 18:00까지 온라인 접수`;

  const $ = (s)=>document.querySelector(s);
  const textEl = $("#text");
  const runBtn = $("#runBtn");
  const sampleBtn = $("#sampleBtn");
  const docList = $("#docList");
  const docListDocs = $("#docListDocs");
  const docAddBtnDocs = $("#docAddBtnDocs");
  const docResetBtnDocs = $("#docResetBtnDocs");
  const docCountTag = $("#docCountTag");
  const docCountTagDocs = $("#docCountTagDocs");
  const dropZone = $("#dropZone");
  const leftPanel = $("#left-panel");
  const rightResult = $("#right-result");
  const rightDocs = $("#right-docs");
  const rightPanel = document.querySelector(".right-panel");
  const tabCompare = $("#tab-compare");
  const tabDocs = $("#tab-docs");
  const tabIntro = $("#tab-intro");
  let noticeEl = $("#notice");
  const resultBox = $("#resultBox");
  const resultSummary = $("#resultSummary");
  const resultTable = $("#resultTable");
  const resultAction = $("#resultAction");
  const resultDisclaimer = $("#resultDisclaimer");
  const copyBtn = $("#copyBtn");

  const STORAGE_KEY_DOCS = "mfc_docs_v1";

  function readDocs(){
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY_DOCS) || "[]"); } catch(e){ return []; }
  }
  function writeDocs(docs){ try { localStorage.setItem(STORAGE_KEY_DOCS, JSON.stringify(docs)); } catch(e){} }

  function normalizeName(name){
    return name.toLowerCase().trim().replace(/[\s\-()[]]/g, "");
  }

  function isPublicDocument(name){
    const n = name.toLowerCase();
    return /\b(증명서|확인증|신고증|등록증|허가증|확인서|확인서|등본|초본|납세증명|자격확인|인허가|신고필증)\b/.test(n);
  }

  // 왼쪽 패널 내 서류 목록을 상태에 따라 렌더링 (대조 결과 탭용)
  function renderDocList(docs, statuses){
    if(!docList) return;
    docList.innerHTML = "";
    docCountTag.textContent = "내 서류: " + docs.length;
    if(!docs.length){
      docList.innerHTML = "<p class='text-sm text-gray-400'>아직 등록한 서류가 없습니다. 대조 결과에서 '등록하기'로 서류를 추가하세요.</p>";
      return;
    }
    for(const d of docs){
      const card = document.createElement("div");
      const norm = normalizeName(d.name);
      const status = statuses && statuses[norm] ? statuses[norm] : "대조전";
      let cardClass = "doc-card cond";
      let badgeText = "";
      let badgeClass = "";
      if(status === "대조전"){
        cardClass = "doc-card cond";
        badgeText = "대조 전";
        badgeClass = "bg-gray-100 text-gray-600";
      } else if(status === "충족"){
        cardClass = "doc-card ok";
        badgeText = "조건 충족";
        badgeClass = "bg-green-100 text-green-700";
      } else if(status === "미충족"){
        cardClass = "doc-card missing";
        badgeText = "미충족";
        badgeClass = "bg-red-100 text-red-700";
      } else if(status === "형식확인"){
        cardClass = "doc-card cond";
        badgeText = "형식 확인 필요";
        badgeClass = "bg-yellow-100 text-yellow-700";
      } else if(status === "판단불가"){
        cardClass = "doc-card cond";
        badgeText = "판단 불가";
        badgeClass = "bg-gray-100 text-gray-600";
      } else {
        cardClass = "doc-card missing";
        badgeText = "서류 누락";
        badgeClass = "bg-red-100 text-red-700";
      }
      const head = document.createElement("div");
      head.className = "flex items-center justify-between gap-3";
      const info = document.createElement("div");
      const nameEl = document.createElement("div");
      nameEl.className = "doc-name";
      nameEl.textContent = d.name;
      const issuedEl = document.createElement("div");
      issuedEl.className = "doc-issued";
      issuedEl.textContent = d.issued ? ("발급일: " + d.issued) : "발급일 없음";
      info.appendChild(nameEl);
      info.appendChild(issuedEl);
      const right = document.createElement("div");
      right.className = "flex items-center gap-2";
      if(status === "미충족" || status === "서류 누락" || status === "대조전"){
        const regBtn = document.createElement("button");
        regBtn.type = "button";
        regBtn.className = "doc-register";
        regBtn.textContent = "등록하기";
        regBtn.setAttribute("data-register", d.name.replace(/"/g, "&quot;"));
        right.appendChild(regBtn);
        if(isPublicDocument(d.name)){
          const issueBtn = document.createElement("button");
          issueBtn.type = "button";
          issueBtn.className = "doc-issue";
          issueBtn.textContent = "발급하기";
          issueBtn.setAttribute("data-issue", d.name.replace(/"/g, "&quot;"));
          right.appendChild(issueBtn);
        }
      }
      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "doc-del";
      delBtn.textContent = "삭제";
      delBtn.addEventListener("click", ()=>{
        const next = readDocs().filter(x=>x!==d);
        writeDocs(next);
        renderDocList(next);
        renderDocListDocs(next);
      });
      right.appendChild(delBtn);
      const badge = document.createElement("span");
      badge.className = "doc-tag " + badgeClass;
      badge.textContent = badgeText;
      right.insertBefore(badge, right.firstChild);
      head.appendChild(info);
      head.appendChild(right);
      card.appendChild(head);
      card.className = cardClass;
      docList.appendChild(card);
    }
    // 등록하기 버튼 이벤트 바인딩
    docList.querySelectorAll(".doc-register").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const name = btn.getAttribute("data-register");
        const issued = prompt("발급일 (선택, YYYY-MM-DD):", "");
        const docs = readDocs();
        docs.push({ name: name.trim(), issued: issued && issued.trim() ? issued.trim() : null });
        writeDocs(docs);
        const statuses = buildStatusesFromResult(currentResult);
        renderDocList(docs, statuses);
        renderDocListDocs(docs);
      });
    });
    docList.querySelectorAll(".doc-issue").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const name = btn.getAttribute("data-issue");
        alert(name + " 발급 안내: 해당 서류는 관공서/공공기관에서 발급 가능합니다. (서비스 연동 예정)");
      });
    });
  }

  // 내 서류함 탭용 순수 목록 렌더링 (상태 뱃지 없음, 수정/삭제만)
  function renderDocListDocs(docs){
    docListDocs.innerHTML = "";
    docCountTagDocs.textContent = "총 서류: " + docs.length;
    $("#docPreview").classList.add("hidden");
    if(!docs.length){
      docListDocs.innerHTML = "<p class='text-sm text-gray-400'>아직 등록한 서류가 없습니다. '새 서류 등록'으로 서류를 추가하세요.</p>";
      return;
    }
    for(const d of docs){
      const card = document.createElement("div");
      card.className = "doc-card cond";
      const head = document.createElement("div");
      head.className = "flex items-center justify-between gap-3";
      const info = document.createElement("div");
      const nameEl = document.createElement("div");
      nameEl.className = "doc-name";
      nameEl.textContent = d.name;
      const issuedEl = document.createElement("div");
      issuedEl.className = "doc-issued";
      issuedEl.textContent = d.issued ? ("발급일: " + d.issued) : "발급일 없음";
      info.appendChild(nameEl);
      info.appendChild(issuedEl);
      const right = document.createElement("div");
      right.className = "flex items-center gap-2";
      const editBtn = document.createElement("button");
      editBtn.type = "button";
      editBtn.className = "doc-edit";
      editBtn.textContent = "수정";
      editBtn.addEventListener("click", ()=>{
        const newName = prompt("서류명:", d.name);
        if(!newName || !newName.trim()) return;
        const newIssued = prompt("발급일 (선택, YYYY-MM-DD):", d.issued || "");
        const idx = readDocs().indexOf(d);
        if(idx >= 0){
          const arr = readDocs();
          arr[idx] = { name: newName.trim(), issued: newIssued && newIssued.trim() ? newIssued.trim() : null };
          writeDocs(arr);
          renderDocListDocs(readDocs());
        }
      });
      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "doc-del";
      delBtn.textContent = "삭제";
      delBtn.addEventListener("click", ()=>{
        const next = readDocs().filter(x=>x!==d);
        writeDocs(next);
        renderDocListDocs(next);
      });
      right.appendChild(editBtn);
      right.appendChild(delBtn);
      head.appendChild(info);
      head.appendChild(right);
      card.appendChild(head);
      docListDocs.appendChild(card);
    }

    // 열람: 카드 클릭 시 오른쪽 미리보기
    docListDocs.querySelectorAll(".doc-card").forEach(card=>{
      const idx = Array.prototype.indexOf.call(docListDocs.querySelectorAll(".doc-card"), card);
      if(!(idx >= 0)) return;
      const d = docs[idx];
      if(!d) return;
      card.addEventListener("click", ()=> showDocPreview(d));
    });
  }

  function showNotice(msg){
    if(!noticeEl){
      const el = document.createElement("div");
      el.id = "notice";
      el.className = "result-foot";
      el.style.color = "#9b1c1c";
      el.style.background = "#fef2f2";
      el.style.border = "1px solid #fca5a5";
      el.style.borderRadius = "6px";
      el.style.padding = "8px";
      el.style.marginTop = "14px";
      el.style.fontSize = "13px";
      document.querySelector("#right-result").appendChild(el);
      noticeEl = el;
    }
    noticeEl.textContent = msg;
    noticeEl.style.display = "block";
  }

  // 열람: 카드 클릭 시 오른쪽 미리보기
  function showDocPreview(doc){
    // 최초 등록일/최종 수정일 추정(보관된 문서에 필드가 없을 수 있음)
    const now = new Date().toLocaleString("ko-KR");
    $("#previewName").textContent = doc.name;
    $("#previewIssued").textContent = doc.issued ? ("발급일: " + doc.issued) : "발급일 없음";
    $("#previewRegDate").textContent = "등록: " + (doc.regDate ? doc.regDate : now);
    $("#previewModDate").textContent = "최종 수정: " + now;
    $("#docPreview").classList.remove("hidden");

    $("#previewEditBtn").onclick = ()=>{
      const newName = prompt("서류명:", doc.name);
      if(!newName || !newName.trim()) return;
      const newIssued = prompt("발급일 (선택, YYYY-MM-DD):", doc.issued || "");
      const docs = readDocs();
      const idx = docs.indexOf(doc);
      if(idx >= 0){
        docs[idx] = { name: newName.trim(), issued: newIssued && newIssued.trim() || null, regDate: docs[idx].regDate || new Date().toLocaleString("ko-KR"), modDate: now };
        writeDocs(docs);
        renderDocListDocs(docs);
        $("#docPreview").classList.add("hidden");
      }
    };
    $("#previewDeleteBtn").onclick = ()=>{
      if(!confirm("'" + doc.name + "'을(를) 삭제하시겠습니까?")) return;
      const next = readDocs().filter(x=>x!==doc);
      writeDocs(next);
      renderDocListDocs(next);
      $("#docPreview").classList.add("hidden");
    };
    $("#previewCloseBtn").onclick = ()=> $("#docPreview").classList.add("hidden");
  }

  // 대비용: 필요 서류+보유 여부 전용 렌더
  function renderContrastResult(result){
    const rows = result && result.rows ? result.rows : [];
    const list = $("#contrastList");
    if(!rows.length){
      list.innerHTML = "<p class='text-sm text-gray-400'>대조 결과가 없습니다.</p>";
      $("#contrastSummary").textContent = "대조 결과가 없습니다.";
      return;
    }

    const ownedNames = readDocs().map(d=>d.name);
    const ownedNorms = new Set(ownedNames.map(normalizeName));

    list.innerHTML = "";
    let needCount = 0;
    let haveCount = 0;

    for(const row of rows){
      const r = document.createElement("div");
      r.className = "border border-gray-100 rounded-lg p-4";
      const needNorm = normalizeName(row.name || "");
      const isOwn = ownedNorms.has(needNorm);
      if(!isOwn) needCount++;
      else haveCount++;

      const head = document.createElement("div");
      head.className = "flex justify-between items-start gap-2 mb-2";

      const name = document.createElement("div");
      name.className = "font-medium";
      name.textContent = row.name;
      head.appendChild(name);

      const badge = document.createElement("span");
      if(isOwn){
        badge.className = "text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded";
        badge.textContent = "가지고 있음";
      } else {
        badge.className = "text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded";
        badge.textContent = "필요함";
      }
      head.appendChild(badge);
      r.appendChild(head);

      const sub = document.createElement("div");
      sub.className = "text-sm text-gray-500";
      sub.textContent = row.matchNote || "";
      r.appendChild(sub);

      list.appendChild(r);
    }

    $("#contrastSummary").textContent = "필수·구비 서류 " + (needCount+haveCount) + "건 중 보유 " + haveCount + "건, 필요 " + needCount + "건";
    $("#docCountTag").textContent = "내 서류: " + ownedNames.length;
  }

  let currentTab = "compare";
  let currentResult = null;

  function buildStatusesFromResult(result){
    if(!result || !result.rows) return {};
    const m = {};
    for(const r of result.rows){
      const norm = normalizeName(r.name);
      m[norm] = r.status;
    }
    return m;
  }

  function tabSwitch(tab){
    currentTab = tab;
    tabCompare.classList.toggle("active", tab === "compare");
    tabDocs.classList.toggle("active", tab === "docs");
    tabIntro.classList.toggle("active", tab === "intro");
    if(tab === "compare"){
      leftPanel.classList.remove("hidden");
      leftPanel.classList.remove("lg:col-span-2");
      rightPanel.classList.remove("lg:col-span-2");
      rightPanel.classList.add("lg:col-span-1");
      rightResult.classList.add("active");
      rightDocs.classList.remove("active");
      // 대비용: 필요 서류+보유 여부 전용 렌더
      renderContrastResult(currentResult);
    } else {
      leftPanel.classList.add("hidden");
      leftPanel.classList.add("lg:col-span-2");
      rightPanel.classList.remove("lg:col-span-1");
      rightPanel.classList.add("lg:col-span-2");
      rightResult.classList.remove("active");
      rightDocs.classList.remove("active");
      if(tab === "docs"){
        rightDocs.classList.add("active");
        renderDocListDocs(readDocs());
      }
    }
  }

  tabCompare.addEventListener("click", (e)=>{ e.preventDefault(); tabSwitch("compare"); });
  tabDocs.addEventListener("click", (e)=>{ e.preventDefault(); tabSwitch("docs"); });
  tabIntro.addEventListener("click", (e)=>{ e.preventDefault(); tabSwitch("intro"); });

  function runWithText(text, docs){
    if(!text.trim()){ showNotice("공고문을 붙여넣어 주세요."); return; }
    runBtn.disabled = true;
    runBtnText.textContent = "대조 중";
    runBtnSpinner.style.display = "inline-block";
    setRunStatus("서버에 대조 요청을 보내는 중...");
    currentResult = null;
    if(!noticeEl) showNotice("");
    fetch("/api/check", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, owned: docs })
    })
      .then(r=>{
        if(!r.ok){
          runBtn.disabled = false;
          runBtnText.textContent = "대조하기";
          runBtnSpinner.style.display = "none";
          setRunStatus("");
          showNotice("대조 결과 요청이 실패했습니다. (HTTP " + r.status + ")");
          return Promise.reject(new Error("HTTP " + r.status));
        }
        setRunStatus("Solar Pro 4가 공고문에서 제출 요건을 추출 중...");
        return r.json().then(data=>{
          // 실제 호출과 별개로 잠깐 대기해 중간 상태가 보이도록 함
          return new Promise(resolve=>setTimeout(resolve, 900)).then(()=>data);
        });
      })
      .then(data=>{
        runBtn.disabled = false;
        runBtnText.textContent = "대조하기";
        runBtnSpinner.style.display = "none";
        if(data.error || data.detail){
          setRunStatus("");
          showNotice(data.error + " " + (data.detail||""));
          return;
        }
        if(data.notice){
          setRunStatus("");
          showNotice(data.notice);
          return;
        }
        setRunStatus("추출한 요건과 보유 서류를 대조 중...");
        currentResult = data;
        // 대조 결과 탭으로 전환
        return new Promise(resolve=>setTimeout(resolve, 500)).then(()=>{
          tabSwitch("compare");
          setRunStatus("");
          return data;
        });
      })
      .catch(err=>{
        runBtn.disabled = false;
        runBtnText.textContent = "대조하기";
        runBtnSpinner.style.display = "none";
        setRunStatus("");
        showNotice("대조 결과를 가져올 수 없습니다. 다시 시도해 주세요.");
      });
  }

  function setRunStatus(msg){
    const el = $("#runStatus");
    if(!el) return;
    if(msg){
      el.textContent = msg;
      el.classList.remove("text-gray-400");
      el.classList.add("text-blue-600", "font-medium");
    } else {
      el.textContent = "";
      el.classList.remove("text-blue-600", "font-medium");
      el.classList.add("text-gray-400");
    }
  }

  // 예시 공고로 해보기: 왼쪽 텍스트 채우고 바로 대조
  sampleBtn.addEventListener("click", ()=>{ textEl.value = SAMPLE_NOTICE; runWithText(SAMPLE_NOTICE, readDocs()); });
  runBtn.addEventListener("click", ()=>{ runWithText(textEl.value, readDocs()); });

  docAddBtnDocs.addEventListener("click", ()=>{
    const name = prompt("서류명:");
    if(!name || !name.trim()) return;
    const issued = prompt("발급일 (선택, YYYY-MM-DD):", "");
    const docs = readDocs();
    docs.push({ name: name.trim(), issued: issued && issued.trim() ? issued.trim() : null });
    writeDocs(docs);
    renderDocListDocs(docs);
  });

  docResetBtnDocs.addEventListener("click", ()=>{
    if(!confirm("내 서류를 모두 삭제하시겠습니까?")) return;
    writeDocs([]);
    renderDocListDocs([]);
  });

  // 드래그앤드롭
  ["dragenter","dragover","dragleave","drop"].forEach(n=>{
    dropZone.addEventListener(n, e=>{ e.preventDefault(); e.stopPropagation(); }, false);
  });
  ["dragenter","dragover"].forEach(n=>{
    dropZone.addEventListener(n, ()=>{ dropZone.classList.add("dragover"); }, false);
  });
  ["dragleave","drop"].forEach(n=>{
    dropZone.addEventListener(n, ()=>{ dropZone.classList.remove("dragover"); }, false);
  });
  dropZone.addEventListener("drop", e=>{
    e.preventDefault();
    e.stopPropagation();
    const files = e.dataTransfer.files;
    if(files.length){
      const file = files[0];
      if(!file.type.startsWith("application/pdf") && !file.type.startsWith("image/") && !file.name.match(/\.(pdf|jpg|jpeg|png|webp|docx|pptx|xlsx)$/i)){
        showNotice("지원하지 않는 파일 형식입니다. PDF, JPG, PNG 등 공고문 파일을 업로드하세요.");
        return;
      }
      uploadFileToParse(file);
    } else {
      showNotice("파일이 첨부되지 않았습니다.");
    }
  });
  dropZone.addEventListener("click", ()=>{
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".pdf,.jpg,.jpeg,.png,.webp,.docx,.pptx,.xlsx";
    input.onchange = ()=>{
      const files = input.files;
      if(files && files.length){
        uploadFileToParse(files[0]);
      }
    };
    input.click();
  });

  // 파일 업로드 → 파싱 → 텍스트 채우기
  async function uploadFileToParse(file){
    if(file.size > 4 * 1024 * 1024){
      showNotice("파일 크기가 너무 큽니다. 최대 4MB까지 업로드할 수 있습니다.");
      return;
    }
    dropZone.classList.add("dragover");
    showNotice("문서를 파싱 중...");
    try{
      const formData = new FormData();
      formData.append("document", file);
      const response = await fetch("/api/parse", { method: "POST", body: formData });
      const data = await response.json();
      if(!response.ok){
        showNotice(data.error || "문서 파싱에 실패했습니다.");
        return;
      }
      if(!data.ok){
        showNotice(data.detail || "문서 파싱 결과를 읽을 수 없습니다.");
        return;
      }
      textEl.value = data.text;
      $("#contrastSummary").textContent = "문서에서 " + (data.text || "").length + "자 추출됨. 결과를 확인하려면 '대조하기'를 누르세요.";
      showNotice("문서 파싱 완료: " + (data.text || "").length + "자 추출됨");
    }catch(err){
      showNotice("문서 파싱 요청 중 오류가 발생했습니다.");
    }finally{
      dropZone.classList.remove("dragover");
    }
  }

  // 초기 렌더링
  tabSwitch("compare");
})();
</script>
</body>
</html>
